name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches version
        run: |
          VERSION="$(grep -o 'appVersion = "[^"]*"' Sources/Version.swift | cut -d'"' -f2)"
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match appVersion v$VERSION" >&2
            exit 1
          fi

      - name: Compile
        run: make build

      - name: Smoke test
        run: |
          ./bin/tws-mic-switcher help
          ./bin/tws-mic-switcher --version
          ./bin/tws-mic-switcher status

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/tws-mic-switcher-${GITHUB_REF_NAME}-macos-arm64.tar.gz" \
            -C . bin/tws-mic-switcher README.md install.sh uninstall.sh
          (cd dist && shasum -a 256 ./*.tar.gz > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ### Install

          ```bash
          curl -fsSL https://raw.githubusercontent.com/whoavidwivedi/tws-mic-switcher/main/install.sh | bash
          ```

          ### Upgrade

          Existing installations update in place with the same command, or with:

          ```bash
          tws-mic-switcher update
          ```

          Verify the downloaded archive with `SHA256SUMS`.
          EOF

          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --title "TWS Mic Switcher ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "$(cat "$RUNNER_TEMP/notes.md")"
